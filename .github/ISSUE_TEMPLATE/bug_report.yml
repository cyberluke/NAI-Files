name: Bug Report
description: Report a bug in NAI Files.
title: 'Bug: '
labels: ['bug']
body:

  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > Search the existing issues first. The problem may already be reported, and an existing thread is the best place to add details.

  - type: textarea
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that reliably shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of NAI Files is affected?
      options:
        - Pulse view
        - Media Lab (FFmpeg)
        - AI and semantic search
        - File operations
        - Settings, language or theme
        - Installation or packaging
        - Other
    validations:
      required: true

  - type: input
    id: files_version
    attributes:
      label: NAI Files version
      description: Settings → About → Copy → Files version.
      placeholder: "e.g. 4.3.0.172"
    validations:
      required: true

  - type: input
    id: windows_version
    attributes:
      label: Windows version
      description: Settings → About → Copy → Windows version.
      placeholder: "e.g. 10.0.26100.0"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Open logs with **Settings → About → Open log location**. Review the file and remove usernames, drive names or paths you do not want to publish before uploading it.

  - type: upload
    attributes:
      label: Log file
      description: The app log helps reproduce and diagnose the issue.
    validations:
      required: true
      accept: ".log"

  - type: input
    id: user_id
    attributes:
      label: User ID (optional)
      description: A local GUID from Settings → About → Copy → User ID. It is not sent automatically; include it only if you want to correlate this report with the log excerpts you share.
      placeholder: "74750836-5885-4eeb-964f-8177cb4babf6"
    validations:
      required: false
